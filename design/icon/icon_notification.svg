<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <mask id="notifMask">
    <rect width="96" height="96" fill="white"/>
    <!-- Checkmark cutout to separate checkmark from crate silhouette -->
    <path d="M 34 52 L 44 62 L 66 36" fill="none" stroke="black" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </mask>
  
  <g mask="url(#notifMask)">
    <!-- Flaps -->
    <polygon points="26,42 20,30 34,28 38,42" fill="#FFFFFF"/>
    <polygon points="70,42 76,30 62,28 58,42" fill="#FFFFFF"/>
    <!-- Crate Body -->
    <rect x="22" y="40" width="52" height="36" rx="4" fill="#FFFFFF"/>
  </g>
  
  <!-- Checkmark -->
  <path d="M 34 52 L 44 62 L 66 36" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>