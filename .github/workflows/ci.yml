name: CI & Deployment Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  server:
    name: Server Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, openssl, curl, json, ctype, tokenizer, xml
          coverage: none

      - name: Validate composer.json (strict)
        run: |
          cd server
          composer validate --strict

      - name: Composer Audit (Blocking)
        run: |
          cd server
          composer audit

      - name: Install Composer dependencies
        run: |
          cd server
          composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHPUnit
        run: |
          cd server
          ./vendor/bin/phpunit

  app:
    name: Flutter App Checks & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Flutter dependencies
        run: |
          cd app
          flutter pub get

      - name: Flutter Analyze (Blocking Gate)
        run: |
          cd app
          flutter analyze

      - name: Flutter Test (Blocking Gate)
        run: |
          cd app
          flutter test

  osv-scanner:
    name: OSV Vulnerability Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OSV-Scanner on lockfiles (Blocking Gate)
        uses: google/osv-scanner-action@v1.9.2
        with:
          scan-args: |-
            --lockfile=server/composer.lock
            --lockfile=app/pubspec.lock

  server-deployable:
    name: Package Deployable Shared Hosting Zip
    needs: [server, app, osv-scanner]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, openssl, curl, json, ctype, tokenizer, xml
          coverage: none

      - name: Build deployable production archive
        run: |
          ./scripts/build-zip.sh

      - name: Upload Deployment Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventory-server-deployable
          path: dist/inventory-server.zip
          if-no-files-found: error
          retention-days: 14

  release-app:
    name: Build & Package Release Mobile Binaries
    permissions:
      contents: write
    needs: [server, app, osv-scanner]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine Version Name and Code
        id: versioning
        run: |
          [[ "${GITHUB_REF_NAME}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "Release tag must be vMAJOR.MINOR.PATCH" >&2; exit 1; }
          VER="${GITHUB_REF_NAME#v}"
          echo "VERSION_NAME=${VER}" >> $GITHUB_OUTPUT
          echo "BUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Configure Keystore Secrets (Safe Injection)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Release artifacts must never be signed with the debug key.
          for secret_name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "Required signing secret is missing: ${secret_name}" >&2
              exit 1
            fi
          done
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/upload-keystore.jks"
          test -s "${RUNNER_TEMP}/upload-keystore.jks"
          cat <<EOF > app/android/key.properties
storePassword=${KEYSTORE_PASSWORD}
keyPassword=${KEY_PASSWORD}
keyAlias=${KEY_ALIAS}
storeFile=${RUNNER_TEMP}/upload-keystore.jks
EOF

      - name: Build Signed Release AAB and APKs
        run: |
          ./scripts/build_release_artifacts.sh "${{ steps.versioning.outputs.VERSION_NAME }}" "${{ steps.versioning.outputs.BUILD_NUMBER }}"

      - name: Generate Release Notes & Changelog
        id: changelog
        run: |
          CHANGELOG_FILE="dist/release/CHANGELOG.md"
          echo "## Release v${{ steps.versioning.outputs.VERSION_NAME }} (Build ${{ steps.versioning.outputs.BUILD_NUMBER }})" > "${CHANGELOG_FILE}"
          echo "" >> "${CHANGELOG_FILE}"
          echo "### SHA-256 Checksums" >> "${CHANGELOG_FILE}"
          echo '```' >> "${CHANGELOG_FILE}"
          cat dist/release/SHA256SUMS.txt >> "${CHANGELOG_FILE}"
          echo '```' >> "${CHANGELOG_FILE}"
          echo "" >> "${CHANGELOG_FILE}"
          echo "### Recent Commits" >> "${CHANGELOG_FILE}"
          git log -n 15 --pretty=format:"* %s (%h)" >> "${CHANGELOG_FILE}" || true
          echo "" >> "${CHANGELOG_FILE}"

      - name: Upload Release Binaries Artifact
        uses: actions/upload-artifact@v4
        with:
          name: inventory-mobile-release-v${{ steps.versioning.outputs.VERSION_NAME }}
          path: dist/release/
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: dist/release/CHANGELOG.md
          files: |
            dist/release/app-release.aab
            dist/release/app-arm64-v8a-release.apk
            dist/release/app-armeabi-v7a-release.apk
            dist/release/app-release.apk
            dist/release/app-symbols-*.zip
            dist/release/SHA256SUMS.txt
